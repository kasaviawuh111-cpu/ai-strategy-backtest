  <style>

padding:0;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}.review-close:hover{background:var(--surface-sunken)}.review-close svg{width:20px;height:20px}.review .mcard{border:0;box-shadow:none;border-radius:0;overflow:visible}.review .mcard>.pad{padding:0 16px 4px}.symbol{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--hairline)}.symbol .nm{font-size:17px;font-weight:600;line-height:24px;white-space:nowrap}.symbol .cd{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}.exec-entry{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:1px;border:0;background:none;padding:2px 0 2px 3px;color:var(--ink-3);font-size:12px;line-height:18px;white-space:nowrap}.exec-entry .v{color:var(--ink-4)}.exec-entry .v:before{content:"·";margin:0 3px;color:var(--ink-5)}.chev{width:16px;height:16px;color:var(--ink-4);flex:0 0 auto}.exec-entry .chev{width:12px;height:12px}.erows{margin-top:10px;padding-left:32px;counter-reset:flowstep}.erow{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--hairline-2);border-radius:8px;background:#fff;padding:12px;min-height:52px;color:var(--ink-1)}.erow:before{counter-increment:flowstep;content:counter(flowstep);position:absolute;left:-32px;top:14px;width:22px;height:22px;border-radius:50%;border:1px solid var(--hairline-2);background:#fff;color:var(--ink-3);display:grid;place-items:center;font-size:11px;line-height:1}.erow:not(:last-child):after{content:"";position:absolute;left:50%;bottom:-20px;width:10px;height:16px;transform:translateX(-50%);background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='16' fill='none' stroke='%23c3cad3' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 1v13M1.6 10.4 5 13.8l3.4-3.4'/%3E%3C/svg%3E") no-repeat center/10px 16px}.erow+.erow{margin-top:20px}.erow .lb{align-self:flex-start;margin-top:1px;padding:2px 8px;border-radius:6px;background:var(--surface-sunken);color:var(--ink-2);font-size:12px;line-height:18px;font-weight:500;flex:0 0 auto}.erow .val{flex:1;min-width:0;font-size:15px;line-height:22px;font-weight:500;overflow-wrap:anywhere}.erow.buy .lb{background:rgba(255,0,102,.07);color:#f06}.erow.sell .lb{background:rgba(47,158,95,.08);color:#2f9e5f}.erow:disabled{cursor:default;opacity:.76}.review .run-foot{padding:0 16px;margin-top:14px}.run-button{width:100%;height:48px;border:0;background:#000;color:#fff;font-size:16px;font-weight:500;border-radius:999px;margin:0 0 14px}.run-button:disabled{background:var(--ink-5)}
    .dock{flex:0 0 auto;padding:12px 16px 0;background:#fff}.inputbar{width:100%;min-height:56px;border:1px solid transparent;border-radius:28px;background:var(--surface-card);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px}.inputbar:focus-within{border-color:var(--hairline-2);background:#fff}.inputbar input{flex:1;min-width:0;height:44px;border:0;outline:0;background:none;font-size:16px;line-height:24px;color:var(--ink-1)}.inputbar input::placeholder{color:var(--ink-4)}.send{width:44px;height:44px;flex:0 0 auto;border:0;border-radius:50%;display:grid;place-items:center;background:#000;color:#fff}.send:disabled{background:var(--ink-5)}.disclaimer{margin:9px 0 10px;text-align:center;font-size:11px;line-height:16px;color:var(--ink-4)}
    .stream{padding:8px 16px 24px;display:flex;flex-direction:column;gap:22px}.daydiv{text-align:center;font-size:11px;line-height:16px;letter-spacing:.1em;color:var(--ink-4);padding:8px 0 0}.turn{display:flex;flex-direction:column;gap:12px}.turn.me{align-items:flex-end}.bubble{max-width:100%;padding:11px 16px;font-size:16px;line-height:24px;border-radius:16px;background:#f1f3f5}.say{font-size:16px;line-height:26px;margin:0;color:#000}.preview-card{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"eyebrow icon" "name icon";align-items:center;gap:2px 12px;width:100%;text-align:left;padding:13px 16px;border:1px solid var(--hairline-2);border-radius:12px;background:#fff}.preview-eyebrow{grid-area:eyebrow;font-size:12px;line-height:18px;color:var(--ink-3)}.preview-name{grid-area:name;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-size:19px;line-height:27px;font-weight:400;letter-spacing:-.01em;color:#000}.preview-card svg{grid-area:icon;color:var(--ink-2);width:18px;height:18px}.mcard{width:100%;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--hairline);box-shadow:0 1px 2px rgba(20,28,68,.04)}.mcard .pad{padding:16px}.mcard .foot{border-top:1px solid var(--hairline);display:flex}.mcard .foot button{flex:1;height:48px;border:0;background:none;font-size:16px;font-weight:500;color:var(--color-primary)}.mcard .foot button+button{border-left:1px solid var(--hairline)}.mcard .foot .mute{color:var(--ink-3)}.failure-head{display:flex;gap:8px;align-items:center;font-size:16px;line-height:22px}.tag{margin-left:auto;font-size:11px;line-height:16px;border:1px solid rgba(255,0,102,.3);padding:1px 5px;border-radius:3px;background:rgba(255,0,102,.07);color:#f06}.failure-copy{margin:8px 0 0;font-size:14px;line-height:22px;color:var(--ink-2)}.preserved{margin:10px 0 0;font-size:12px;line-height:19px;color:var(--ink-3)}
    .thinking-stream{padding:2px 0}.model-reasoning{width:100%;margin:14px 0;color:var(--ink-2);font-size:14px;line-height:1.75}.model-reasoning summary{display:flex;justify-content:space-between;gap:16px;cursor:pointer;padding:8px 0;list-style:none;font-weight:500}.model-reasoning summary::-webkit-details-marker{display:none}.model-reasoning summary span:last-child{color:var(--ink-3);font-size:12px;font-weight:400}.model-reasoning summary span:last-child:after{content:"展开";margin-left:10px}.model-reasoning[open] summary span:last-child:after{content:"收起"}.model-reasoning__body{max-height:160px;overflow:auto;padding:12px 16px;background:var(--surface-card);border-radius:12px}.model-reasoning__body p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.thinking-action{display:flex;justify-content:flex-end;gap:16px}.text-action{border:0;background:none;padding:2px 0;min-height:32px;color:var(--ink-3);font-size:12px;line-height:18px}.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink-4);opacity:.35;animation:blink 1.1s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes blink{0%,60%,100%{opacity:.28}30%{opacity:1}}.inline-status{padding:0 16px 20px}.chip{border:1px solid var(--hairline-2);color:#000;background:#fff;border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;line-height:21px}.chips{display:flex;flex-wrap:wrap;gap:8px}.home{padding:46px 16px 32px}.home h3{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;letter-spacing:-.02em;text-align:center;margin:12px auto 26px;max-width:12em}.home .inputbar{min-height:104px;align-items:flex-start;border-radius:20px;padding:16px 8px 16px 20px;background:#fff;border-color:var(--hairline);box-shadow:0 10px 44px -18px rgba(255,110,140,.42),0 6px 30px -14px rgba(105,130,255,.3)}.home .send{align-self:center}.home .chips{gap:6px;margin-top:12px}.home .chip{width:100%;border-color:transparent;border-radius:10px;background:var(--surface-card);padding:11px 14px;text-align:left;font-size:13px;font-weight:400;line-height:20px}.caption{font-size:12px;line-height:19px;color:var(--ink-3);margin:12px 0 0;min-height:38px}.hint-line{font-size:12px;line-height:19px;color:var(--ink-3);margin:0}.demo-report{font-family:var(--display);font-size:24px;line-height:32px;margin:0 0 8px}.bottom-note{margin:18px 0 0;font-size:12px;line-height:20px;color:var(--ink-3)}
    @media(max-width:870px){.preview{padding:20px 16px}.comparison{gap:18px;grid-template-columns:repeat(2,minmax(0,390px))}.phone{height:720px}.exec-entry .v{display:none}}@media(max-width:690px){.comparison{grid-template-columns:minmax(0,390px);gap:24px}.preview h1{font-size:20px}.preview-note{margin-left:0}.toolbar-label{width:100%}.phone{height:720px}.legend{gap:12px;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.dots i{animation:none}}
  </style>
</head>
<body>
  <main class="preview">
    <h1>回测开始后，进度始终看得见</h1>
    <p class="intro">仅交互预览 · 尚未修改正式页面 · 不调用模型，不执行回测。</p>
    <div class="legend" aria-label="设计范围"><span><i></i>现状保留</span><span><i class="changed"></i>修改进度与返回</span><span><i class="added"></i>新增手机新建入口</span></div>
    <section class="toolbar" aria-label="外部预览控制，不是产品按钮">
      <div class="toolbar-row"><span class="toolbar-label">方案</span><button class="control" data-mode="A" aria-pressed="true">A 推荐 · 回到对话看进度</button><button class="control" data-mode="B" aria-pressed="false">B · 留在策略页看进度</button></div>
      <div class="toolbar-row"><span class="toolbar-label">演示状态</span><button class="control subtle" data-state="reconnecting">暂时断线</button><button class="control subtle" data-state="slow">仍未完成</button><button class="control subtle" data-state="succeeded">查看完成态</button><button class="control subtle" data-state="failed">最终失败</button><button class="control subtle" data-state="submit-error">提交未完成</button></div>
      <div class="toolbar-row"><span class="toolbar-label">场景</span><button class="control subtle" id="reset">重置对照</button><button class="control subtle" id="reenter">首页重新进入</button><span class="hint-line">可滚动画面，点击「开始回测」。</span></div>
      <p class="preview-note">以上均为预览控制。网页内返回更清楚，微信底部箭头不改。</p>
    </section>
    <section class="comparison" aria-label="当前线上与新方案对照">
      <article class="column"><div class="column-head"><h2>当前布局</h2><span>失败分支演示</span></div><div class="phone" id="current"></div><p class="caption" id="current-caption">模拟回测失败：按钮会恢复，提示留在被遮住的对话里。</p></article>
      <article class="column"><div class="column-head"><h2 id="proposal-title">方案 A · 回到对话看进度</h2><span>交互提案</span></div><div class="phone" id="proposal"></div><p class="caption" id="proposal-caption">开始后回到对话，进度、重试和结果都留在当前策略下面。</p></article>
    </section>
    <p class="bottom-note">「首页重新进入」只模拟再次打开网页，不模拟微信退出或确认页，也不代表手机兼容问题已经修复。</p>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const svg = (path, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"/></svg>`;
      const chevron = `<svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const escape = (value) => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const samples = [
        {name:'贵州茅台',code:'600519.SH',buy:'收盘价创前 20 日新高且成交量超过前 20 日均量的 1.5 倍',sell:'从持仓后最高收盘价回撤 8% 或持有满 40 个交易日卖出',utterance:'贵州茅台，收盘价创前20日新高且成交量超过前20日均量1.5倍买入；从持仓后最高收盘价回撤8%或持有满40个交易日卖出。'},
        {name:'美的集团',code:'000333.SZ',buy:'14 日 RSI 从下向上穿过 30 且当日成交额超过 5 亿元',sell:'14 日 RSI 高于 55、持仓亏损 5% 或持有满 10 个交易日卖出',utterance:'美的集团，14日RSI从30下方上穿30且当日成交额超过5亿元买入；14日RSI高于55、持仓亏损5%或持有满10个交易日卖出。'}
      ];
      const original = {name:'长鑫科技',code:'688825.SH',buy:'5 日均线上穿 20 日均线',sell:'任一先发生（5 日均线下穿 20 日均线 / 实际买入成交后第 20 个交易日卖出）',utterance:'长鑫科技，5日均线上穿20日均线买入，5日均线下穿20日均线或持有满20个交易日卖出。'};
      let mode = 'A', old = {screen:'review',phase:'idle'}, next = {screen:'review',phase:'idle',draft:original,utterance:original.utterance,generation:false}, generationToken = 0, oldToken = 0, runToken = 0;
      const active = phase => ['submitting','running','reconnecting','slow'].includes(phase);
      const title = draft => `${draft.name} ${draft.buy}买入，${draft.sell}${draft.sell.endsWith('卖出') ? '' : '卖出'}`;
      const dots = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
      const statusCopy = {submitting:'正在提交回测，请稍等。',running:'正在读取历史数据',reconnecting:'连接暂时中断，正在继续查询这次回测。',slow:'这次还需要一点时间，仍在查询回测进度。'};
      function topbar(isNew, state){return `<header class="topbar"><span class="wordmark"><i></i>策略回测</span>${isNew?`<button class="new-strategy" data-action="new" title="提案：将已有的新建策略入口放到手机上" ${active(state.phase)?'disabled':''}>新建策略</button>`:''}</header>`;}
      function dock(value = '', disabled = false, home = false){return `<${home?'div':'footer'} class="${home?'home-composer':'dock'}"><form class="inputbar" data-action="input"><input aria-label="交易规则" value="${escape(value)}" placeholder="说出什么时候买、什么时候卖" ${disabled?'disabled':''}><button class="send" aria-label="识别交易规则" ${disabled||!value.trim()?'disabled':''}>${svg('M12 19V5m-6 6 6-6 6 6')}</button></form>${home?'':'<p class="disclaimer">仅做历史回测，不构成投资建议</p>'}</${home?'div':'footer'}>`;}
      function previewCard(draft){return `<button class="preview-card" data-action="review"><span class="preview-eyebrow">预览策略</span><span class="preview-name">${escape(title(draft))}</span>${svg('M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6')}</button>`;}
      function progress(phase, isOld = false){return `<div class="thinking-stream"><details class="model-reasoning" open><summary><span>${isOld?'处理过程':'回测进度'}</span><span></span></summary><div class="model-reasoning__body"><p role="status">${escape(statusCopy[phase] || statusCopy.running)}${dots}</p></div></details><div class="thinking-action"><button class="text-action" data-action="cancel">取消回测</button></div></div>`;}
      function failure(draft, submission = false, isOld = false){return `<section class="mcard"><div class="pad"><div class="failure-head"><b>${isOld?'回测失败':submission?'回测尚未提交':'回测未完成'}</b><span class="tag">${isOld?'无法执行':submission?'可重试':'未完成'}</span></div><p class="failure-copy">${isOld?'与东方财富查数 Skill 的连接未完成或中断，本次取数未完成，可以重试。':submission?'这次提交没有完成，可以重试。':'暂时没有取到完整数据，可以重新读取。'}</p>${isOld?'':`<p class="preserved">${escape(draft.name)} · ${escape(draft.code)}<br>买卖条件、近一年区间和成交设置都已保留。</p>`}</div><div class="foot"><button data-action="retry">${submission?'重试回测':'重新读取'}</button><button class="mute" data-action="review">修改规则</button></div></section>`;}
      function readyReport(draft){return `<section class="mcard"><div class="pad"><p class="demo-report">演示报告已就绪</p><p class="failure-copy">${escape(draft.name)} · ${escape(draft.code)}<br>本页不生成收益数据。</p></div><div class="foot"><button data-action="report">查看这次报告</button></div></section>`;}
      function runContent(state, isOld = false){if(active(state.phase))return progress(state.phase,isOld);if(state.phase==='failed'||state.phase==='submit-error')return failure(state.draft||original,state.phase==='submit-error',isOld);if(state.phase==='succeeded')return readyReport(state.draft);if(state.phase==='cancelled')return '<p class="say">回测已取消，原策略已保留。</p><div class="chips"><button class="chip" data-action="retry">重新回测</button><button class="chip" data-action="review">审阅策略</button></div>';return '';}
      function review(state,isNew){const draft = state.draft||original, locked = active(state.phase);const retained = isNew&&mode==='B'&&state.phase!=='idle';return `${isNew?`<div class="review-backbar"><button class="review-back" data-action="close">${svg('M19 12H5m6-6-6 6 6 6')}返回对话</button></div>`:''}<div class="body review"><div class="review-head"><span class="review-eyebrow">审阅你的策略</span><span class="review-title">${escape(title(draft))}</span>${isNew?'':`<button class="review-close" data-action="close" aria-label="收起策略审阅">${svg('m6 6 12 12M6 18 18 6')}</button>`}</div><section class="mcard"><div class="pad"><div class="symbol"><span class="nm">${escape(draft.name)}</span><span class="cd">${escape(draft.code)}</span><button class="exec-entry" data-action="settings" ${locked?'disabled':''}>成交设置<span class="v">默认</span>${chevron}</button></div><div class="erows">${[['buy','买入',draft.buy],['sell','卖出',draft.sell],['','区间','近一年']].map(([kind,label,value])=>`<button class="erow ${kind}" data-action="rule" ${locked?'disabled':''}><span class="lb">${label}</span><span class="val">${escape(value)}</span>${chevron}</button>`).join('')}</div></div>${retained?`<div class="inline-status" id="inline-progress">${runContent(state)}</div>`:`<div class="run-foot"><button class="run-button" data-action="start" ${locked?'disabled':''}>${state.phase==='submitting'?'正在创建任务':locked?'回测运行中':'开始回测'}</button></div>`}</section></div>${dock('',locked)}`;}
      function generationContent(state){if(state.phase==='generation-interrupted')return `<p class="say">结果查询暂时中断，刚才的输入已保留。</p><div class="chips"><button class="chip" data-action="continue">继续查询</button><button class="chip" data-action="edit-input">修改输入</button></div>`;return `<div class="thinking-stream"><details class="model-reasoning" open><summary><span>处理过程</span><span></span></summary><div class="model-reasoning__body"><p role="status">正在整理这条新策略${dots}</p></div></details></div>`;}
      function chat(state,isNew){const draft=state.draft||original;return `<div class="body"><div class="stream"><div class="daydiv">当前会话</div><div class="turn me"><div class="bubble">${escape(state.utterance||draft.utterance)}</div></div>${state.generation?`<div class="turn">${generationContent(state)}</div>`:`<div class="turn">${previewCard(draft)}</div>${state.phase!=='idle'?`<div class="turn me"><div class="bubble">开始回测</div></div><div class="turn">${runContent(state,!isNew)}</div>`:'<div class="turn"><p class="say">买入、卖出和回测区间都可以逐条核对。</p></div>'}`}</div></div>${dock('',active(state.phase)||state.phase==='generating')}`;}
      function home(state){return `<div class="body"><div class="home"><h3>想怎么交易？用一句话告诉我，我来帮你把它变成可回测的策略。</h3>${dock(state.input||'',false,true)}<div class="chips" aria-label="策略示例">${samples.map((sample,index)=>`<button class="chip" data-sample="${index}">${escape(sample.utterance)}</button>`).join('')}</div><p class="disclaimer">仅做历史回测，不构成投资建议</p><p class="hint-line" id="input-hint"></p></div></div>`;}
      function report(state){return `<div class="review-backbar"><button class="review-back" data-action="close">${svg('M19 12H5m6-6-6 6 6 6')}返回对话</button></div><div class="body"><div class="stream" style="padding-top:24px"><p class="demo-report">演示报告已就绪</p><p class="say">${escape(state.draft.name)} · ${escape(state.draft.code)}</p><p class="hint-line">这里是完成态占位，不包含模拟收益或交易明细。</p>${previewCard(state.draft)}</div></div>`;}
      function render(target,state,isNew){const scroll=target.querySelector('.body')?.scrollTop||0;target.innerHTML=topbar(isNew,state)+`<div class="screen">${state.screen==='home'?home(state):state.screen==='review'?review(state,isNew):state.screen==='report'?report(state):chat(state,isNew)}</div>`;target.querySelector('.body')?.scrollTo(0,scroll);}
      function draw(){render($('current'),old,false);render($('proposal'),next,true);$('proposal-title').textContent=`方案 ${mode} · ${mode==='A'?'回到对话看进度':'留在策略页看进度'}`;document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));}
      function scrollBottom(target){requestAnimationFrame(()=>{const body=target.querySelector('.body');if(body)body.scrollTop=body.scrollHeight;});}
      function caption(text){$('proposal-caption').textContent=text;}
      function startOld(){const token=++oldToken;old.phase='submitting';draw();setTimeout(()=>{if(token!==oldToken)return;old.phase='running';draw();},500);setTimeout(()=>{if(token!==oldToken)return;old.phase='failed';draw();$('current-caption').textContent='按钮又变成「开始回测」。点右上角 ×，才能在对话中看到失败。';},2300);}
      function startNew(){if(!next.draft)return;const token=++runToken;next.generation=false;next.phase='submitting';if(mode==='B')next.screen='review';draw();if(mode==='B')scrollBottom($('proposal'));caption('正在提交；这段时间也能返回对话，不丢失当前策略。');setTimeout(()=>{if(token!==runToken)return;next.phase='running';if(mode==='A')next.screen='chat';draw();scrollBottom($('proposal'));caption(mode==='A'?'同一条策略下持续显示进度，暂时断线时接着查询。':'同一块进度留在买卖规则下面；返回对话也能继续查看。');},750);}
      function reset(){oldToken++;runToken++;generationToken++;old={screen:'review',phase:'idle'};next={screen:'review',phase:'idle',draft:original,utterance:original.utterance,generation:false};draw();$('current-caption').textContent='点击开始后，按钮会恢复；回测失败留在被遮住的对话里。';caption(mode==='A'?'开始后回到对话，进度、重试和结果都留在当前策略下面。':'开始后保留策略审阅，在买卖规则下面持续显示回测进度。');}
      function enterHome(){runToken++;generationToken++;next={screen:'home',phase:'idle',draft:null,utterance:'',input:'',generation:false};draw();caption('模拟新进入：只保留初始首页；点击任一完整示例，生成独立的新策略。');}
      function beginGeneration(index){runToken++;const token=++generationToken;const sample=samples[index];next={screen:'chat',phase:'generating',draft:null,utterance:sample.utterance,generation:true,sampleIndex:index};draw();scrollBottom($('proposal'));caption('新输入独立处理，不使用前一条长鑫科技的股票或条件。');setTimeout(()=>{if(token!==generationToken)return;next.phase='generation-interrupted';draw();scrollBottom($('proposal'));caption('演示结果查询中断：输入仍在，可继续查询，不要求用户再输一遍。');},1600);}
      function continueGeneration(){const token=++generationToken;next.phase='generating';draw();setTimeout(()=>{if(token!==generationToken)return;next.draft=samples[next.sampleIndex];next.generation=false;next.phase='idle';next.screen='review';draw();caption('新策略已就绪：股票、买卖条件全部来自刚才选中的那条示例。');},1200);}
      $('current').addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='start'||action==='retry')startOld();if(action==='close'){old.screen='chat';draw();scrollBottom($('current'));}if(action==='review'){old.screen='review';draw();}if(action==='cancel'){oldToken++;old.phase='cancelled';draw();}});
      $('proposal').addEventListener('click',event=>{const sample=event.target.closest('[data-sample]');if(sample){beginGeneration(Number(sample.dataset.sample));return;}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='start'||action==='retry')startNew();if(action==='close'){next.screen='chat';draw();scrollBottom($('proposal'));caption('返回只收起审阅，当前股票、条件和任务都保留。');}if(action==='review'){next.screen='review';draw();caption('原股票、买卖条件、区间和成交设置仍在。此预览不修改参数。');}if(action==='new')enterHome();if(action==='continue')continueGeneration();if(action==='edit-input'){generationToken++;next.screen='home';next.phase='idle';next.input=next.utterance;draw();caption('原输入已放回输入框，可直接修改；此预览只识别两条示例。');}if(action==='report'){next.screen='report';draw();}if(action==='cancel'){runToken++;next.phase='cancelled';draw();caption('已取消演示回测，原策略仍保留。');}if(action==='rule'||action==='settings'){caption('沿用现有参数编辑；本轮只预览返回与进度，不改条件编辑设计。');}});
      $('proposal').addEventListener('input',event=>{if(event.target.matches('input')){const form=event.target.closest('form');form.querySelector('.send').disabled=!event.target.value.trim();}});
      $('proposal').addEventListener('submit',event=>{event.preventDefault();const value=event.target.querySelector('input').value;const index=samples.findIndex(sample=>sample.utterance===value.trim());if(index>=0)beginGeneration(index);else{const hint=$('input-hint');if(hint)hint.textContent='此预览只演示下面两条示例，不会把输入发给模型。';caption('输入已留在框内。本文件不调用模型；可点任一完整示例体验后续。');}});
      $('current').addEventListener('submit',event=>event.preventDefault());
      document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;reset();}));
      document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>{if(next.generation){if(button.dataset.state==='succeeded')continueGeneration();else{generationToken++;next.phase='generation-interrupted';draw();caption('这是新策略的查询中断，不会回填旧策略。');}return;}if(!next.draft){caption('先点首页的一条示例，再查看对应的中断与继续查询。');return;}runToken++;next.phase=button.dataset.state;next.screen=mode==='A'?'chat':'review';draw();scrollBottom($('proposal'));caption(next.phase==='failed'?'只有确定本次无法继续，才显示未完成；重试和修改入口都在。':next.phase==='submit-error'?'提交未完成也在当前页面给出重试入口，不藏在已关闭的审阅面板里。':next.phase==='succeeded'?'完成态只展示报告就绪，不编造收益。':next.phase==='reconnecting'?'暂时断线仍显示回测进度，不先判定失败，也不重新生成策略。':'继续保留进度；不把正在等待的任务显示成失败。');}));
      $('reset').addEventListener('click',reset);$('reenter').addEventListener('click',enterHome);draw();
    })();
  </script>
</body>
</html>
