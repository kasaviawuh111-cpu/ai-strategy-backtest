<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略审阅与参数页信息层级</title>
<style>
:root{--ink:#000;--ink2:#2b3746;--muted:#8593a5;--line:#e6eaee;--soft:#f6f8f9;--up:#ff0066;--down:#2f9e5f;--r:12px;font-family:Inter,-apple-system,"PingFang SC",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:#eef1f5}.shell{max-width:1200px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:420px 1fr;gap:28px}.page{background:white;border:1px solid var(--line);border-radius:16px;padding:28px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:8px}h1{font-family:"Songti SC",serif;font-size:24px;font-weight:400;margin:0 0 24px}h2{font-size:14px;color:var(--ink2);margin:28px 0 10px}.instrument{font-size:16px;font-weight:600;padding-bottom:20px;border-bottom:1px solid var(--line)}.leg{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.tag{font-size:14px}.buy{color:var(--up)}.sell{color:var(--down)}.rule{font-size:16px;font-weight:600}.hint{font-size:12px;color:var(--muted);margin-top:6px}.button{margin-top:24px;background:#000;color:#fff;text-align:center;padding:14px;border-radius:999px}.section{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.condition{padding:20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:180px minmax(0,280px);gap:24px;align-items:center;min-height:64px;padding:10px 20px;border-bottom:1px solid var(--line)}.label{font-size:14px;color:var(--ink2);font-weight:500}.control{height:44px;border:1px solid #d4d9df;border-radius:6px;padding:10px 12px;font-size:16px}.advanced{margin-top:24px;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;font-size:14px;font-weight:600}.advanced small{display:block;margin-top:4px;font-size:12px;font-weight:400;color:var(--muted)}
@media(max-width:820px){.shell{grid-template-columns:1fr;padding:16px}.page{padding:20px}.row{grid-template-columns:1fr;gap:6px;padding:12px 16px}.control{width:100%}}
</style>
</head>
<body><main class="shell">
<section class="page"><div class="eyebrow">一级 · 审阅策略</div><h1>RSI 上穿 30 买入，持有 10 个交易日退出</h1><div class="instrument">ST信安 · 688201.SH</div><div class="leg"><span class="tag buy">买入</span><div><div class="rule">RSI 由下向上穿过阈值 30</div><div class="hint">点击进入完整参数</div></div></div><div class="leg"><span class="tag sell">卖出</span><div><div class="rule">成交后第 10 个交易日尝试卖出</div><div class="hint">点击进入完整参数</div></div></div><div class="button">开始回测</div></section>
<section class="page"><div class="eyebrow">二级 · 编辑买入条件</div><h1>策略设置</h1><h2>当前条件</h2><div class="section"><div class="condition">相对强弱指标 RSI 由下向上穿过阈值 30</div><div class="row"><span class="label">指标</span><div class="control">相对强弱指标 RSI</div></div><div class="row"><span class="label">触发方式</span><div class="control">由下向上穿过阈值</div></div><div class="row"><span class="label">周期</span><div class="control">14</div></div><div class="row"><span class="label">阈值</span><div class="control">30</div></div></div><div class="advanced">高级研究设置<small>成交、费用、容量、仓位与预热</small></div></section>
</main></body></html>
