    adoption_status: "pypi_sdist_pinned_source_reviewed_oracle_candidate_not_installed_not_executed_not_runtime_dependency"
    reviewed_paths:
      - "ta/volatility.py:AverageTrueRange"
      - "ta/volatility.py:DonchianChannel"
      - "ta/trend.py:ADXIndicator"
      - "ta/momentum.py:StochasticOscillator"
    candidate_scope:
      - "future independent float/pandas comparison vectors for ATR, ADX/DMI, Stochastic and related transparent indicators"
    retained_constraints:
      - "The first-party Decimal implementation, Catalog definition, warmup, and SignalRuntime remain authoritative."
      - "fillna is disabled and pre-warmup zeros/NaNs are never accepted as executable observations."
      - "ATR seed alignment differs: upstream exposes a value at window-1 using its first-row true range; this project leaves first true range unknown and seeds ranges 1..window."
      - "Donchian comparison must shift the upstream band by one completed bar because the executable definition excludes the current bar."
      - "Pandas float, NaN, fillna, index, and zero-volume behavior must be normalized explicitly before any differential assertion."
      - "No library output may bypass prefix-invariance, suspension, parameter-boundary, or golden-vector tests."
    prohibited_semantics:
      - "installing ta as a production dependency solely to replace the Decimal signal runtime"
      - "treating default fill values, leading zeros, or NaNs as tradeable signals"
      - "using an unshifted current-inclusive Donchian band for strict close breakout"

