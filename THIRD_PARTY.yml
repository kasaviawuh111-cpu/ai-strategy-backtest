current_glue_evidence:
  status: "inventory_only_not_final_acceptance_evidence"
  evidence_policy: >-
    Test counts are intentionally not frozen in this inventory. Final evidence must come
    from fresh integration gates on the exact clean revision and locked data snapshots.
  limitations:
    - "No production LLM transport is configured."
    - "The MOSS/pandas indicator adapter is not the canonical runtime default; only EMA and MACD passed the current equivalence gate, while RSI is explicitly incompatible."
    - "No real Mootdx client request or immutable snapshot publication is proven."
    - "The AKShare-shaped Push2 adapter is fixture-tested; the 2026-08-30 direct network probe was disconnected by the remote endpoint, so no Live Push2 batch or snapshot is claimed."
    - "The Mootdx runtime dependency is intentionally not installed because its MIT file and README non-commercial statement conflict; legal and source-data review is pending."
    - "Exact Vibe, MOSS, and AKShare license texts are archived; BaoStock's exact license text and data/service terms remain unresolved."
    - "The archived pypdfium2/PDFium license bundle is specific to the locked darwin_arm64 wheel; other deployment platforms require matching bundles."
    - "No clean-revision Live API or browser acceptance has been run for these adapters."
